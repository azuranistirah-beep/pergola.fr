name: pergolafr-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: pergolafr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pergolafr}
      POSTGRES_USER: ${POSTGRES_USER:-pergolafr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pergolafr_dev_password}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pergolafr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pergolafr} -d ${POSTGRES_DB:-pergolafr}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: pergolafr-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "58081:8080"

volumes:
  pergolafr_postgres_data:
